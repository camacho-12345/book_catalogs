version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb_catalogo_libros
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: catalogo_libros_db
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: api_catalogo_libros
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=catalogo_libros_db
      - COLLECTION_NAME=libros
    depends_on:
      - mongodb
    volumes:
      - .:/app

volumes:
  mongo_data:
